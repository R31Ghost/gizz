name: Verify Gizz publication
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-live-release
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Wait for the exact public release
        env:
          PAGE_URL: https://r31ghost.github.io/gizz/
        run: node .github/scripts/publish-pages.mjs --verify-only
