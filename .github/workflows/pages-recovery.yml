name: Request clean Pages build
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  request-build:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect saved publishing configuration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' repos/${{ github.repository }}/pages --jq '.build_type')
          if [ "$mode" != "legacy" ]; then
            echo 'Managed builds require Deploy from a branch in Settings > Pages.'
            exit 1
          fi
          gh api -H 'X-GitHub-Api-Version: 2026-03-10' repos/${{ github.repository }}/pages --jq '{build_type,source,html_url,status,public,cname}'
      - name: Request a fresh managed build
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method POST -H 'X-GitHub-Api-Version: 2026-03-10'
          repos/${{ github.repository }}/pages/builds
          --jq '{url,status}'
      - name: Explain verification boundary
        run: echo 'This job requests a build. Publication still requires a successful Pages deployment and a verified public release.'
